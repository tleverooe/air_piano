<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空中钢琴 Air Piano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>空中钢琴</h1>
    <p class="status" id="status">点「开始」，允许使用摄像头</p>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <button id="startBtn" class="start" type="button">开始</button>
    </div>
  </main>

  <section class="controls" aria-label="设置">
    <label class="field" for="lowSel"><span>最低音</span><select id="lowSel"></select></label>
    <label class="field" for="highSel"><span>最高音</span><select id="highSel"></select></label>
    <label class="check" for="blackChk"><input id="blackChk" type="checkbox"><span>显示黑键</span></label>
    <label class="field grow" for="topRange"><span>键盘位置</span><input id="topRange" type="range" min="35" max="66" step="1"></label>
    <label class="field grow" for="sensRange"><span>灵敏度</span><input id="sensRange" type="range" min="1" max="10" step="1"></label>
    <p class="keycount" id="keyCount"></p>
  </section>

  <video id="video" class="offscreen" playsinline muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
